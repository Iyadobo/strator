[package]
name = "strator-launcher"
version = "0.1.0"
edition = "2021"
description = "Strator: multi-window terminal dashboard for coding agents"
license = "Apache-2.0"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
portable-pty = "=0.9.0"
vte = "0.13"

[[bin]]
name = "strator"
path = "src/main.rs"
